name: Build Obsidian Quant Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Next.js & Capacitor APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build Next.js Static Export
        run: npm run build

      - name: 6. Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Patch AndroidManifest.xml
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              if (!xml.includes("usesCleartextTraffic")) {
                xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              }
              if (!xml.includes("android.permission.VIBRATE")) {
                xml = xml.replace("</manifest>", "    <uses-permission android:name=\"android.permission.VIBRATE\" />\n</manifest>");
              }
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '

      - name: 8. Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Prepare APK Artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./obsidian-quant-terminal.apk

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Quant-Terminal-APK
          path: ./obsidian-quant-terminal.apk
          retention-days: 30
